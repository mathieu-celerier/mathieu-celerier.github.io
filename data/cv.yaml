summary:
  paragraph: >
    Postdoctoral researcher in CNRS-AIST JRL (Joint Robotics Laboratory) at
    National Institute of Advanced Industrial Science and Technology (AIST) in
    Tsukuba, Japan, in collaboration with the University of Montpellier (UM),
    France. My research interest includes semi-collaborative physical human-robot
    interaction and human-centered perception of physical human-robot interaction.
    I obtained my M.Sc. in Microelectronics and Automation Engineering from
    Polytech Montpellier and worked on dual-arm manipulation of deformable objects
    during my engineering internships at LIRMM.
  pdf_paragraph: |
    Postdoctoral researcher in CNRS-AIST JRL (Joint Robotics Laboratory) at National Institute of Advanced Industrial Science and Technology (AIST) in Tsukuba, Japan, with University of Montpellier (UM), France, through a collaboration between UM and AIST.

    My research interest includes semi collaborative physical human-robot interaction and human centered perception of physical human-robot interaction.

    I obtained my M.Sc in Microelectronic and Automation Engineering in 2021 from Polytech Montpellier Engineering School. I carried out my final Engineering School Internship as Research Engineer, working on Dual Arm Manipulation of Deformable Objects at Laboratory of Informatics, Robotics and Microelectronics of Montpellier (LIRMM), France.

