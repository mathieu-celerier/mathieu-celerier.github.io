summary:
  paragraph: >
    Postdoctoral researcher at the CNRS-AIST Joint Robotics Laboratory in Tsukuba,
    Japan. I study how robots generate motion, respond safely to physical contact,
    and learn collaborative behavior from interaction. My PhD developed online
    disturbance-aware motion generation and an explicit-compliance framework for
    torque-controlled robots. My current work connects physical human-robot
    interaction with imitation learning for collaborative manipulation.
  pdf_paragraph: |
    Postdoctoral researcher at the CNRS-AIST Joint Robotics Laboratory in Tsukuba, Japan. I study how robots generate motion, respond safely to physical contact, and learn collaborative behavior from interaction.

    My PhD developed online disturbance-aware motion generation and an explicit-compliance framework for torque-controlled robots. My current work connects physical human-robot interaction with imitation learning for collaborative manipulation.

