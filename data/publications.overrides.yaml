muraccioliDemonstratingControlFramework2025:
  status: published
  website: 'https://industry-ready-phri.github.io'
  video: 'https://youtu.be/lo9FRXFrVPw'
  featured: true
  highlights:
    - 'Demonstrates compliance, null-space compliance, and dual compliance in static and dynamic interaction.'
    - 'Combines second-order QP safety constraints with real-time torque control.'
    - 'Provides an open, reproducible implementation built on mc_rtc.'
celerier2025explicit:
  status: in-revision
  code: 'https://github.com/mathieu-celerier/explicit_compliance_controller'
  video: 'https://youtu.be/T1H7nLsjT4Y'
  featured: true
  abstract: >-
    A torque-controlled robot in sustained contact has to hold a task where
    precision matters and yield where contact matters, without suspending its
    safety limits in either case. This work places an explicit task- and
    direction-level compliance matrix Γₖ inside a force-compensated
    acceleration-level quadratic program, alongside force-aware barrier
    constraints on position, velocity, torque, and collision. Γₖ is more than a
    compliance level: it generalizes to rendering virtual dynamics such as
    effective inertia and virtual wrenches, and it simultaneously fixes how
    sensitive each task is to force-estimation error, since the residual task
    acceleration error scales with (I − Γₖ). A fully compliant task is
    therefore immune to estimation error while a rigid one is maximally exposed
    — compliance and estimator robustness are set by the same parameter. The
    individual ingredients are established: the contribution is their explicit
    task-level composition and the coupling that composition exposes.
  highlights:
    - 'Sets compliance per task and per direction through a single matrix Γₖ inside a force-compensated QP.'
    - 'The same Γₖ fixes each task’s sensitivity to force-estimation error — a fully compliant task is immune, a rigid one maximally exposed.'
    - 'Γₖ generalizes beyond a compliance level to rendering virtual dynamics, including effective inertia and virtual wrenches.'
    - 'Composes established components rather than claiming inverse-dynamics force compensation, QP control, momentum observers, or barrier constraints as individually novel.'
cariou2025safe:
  status: accepted
  abstract: >-
    This work introduces Acc-CBF-QP, an acceleration-based safety filter that
    constrains reinforcement-learning policies onto a safe set at runtime. The
    unified quadratic program enforces joint position, velocity, torque, and
    collision constraints without modifying policy training, and is evaluated
    in simulation and on Kinova Gen3 and Unitree H1 hardware.
  highlights:
    - 'Filters learned commands at runtime through acceleration-based control barrier functions.'
    - 'Enforces position, velocity, torque, and collision constraints in one QP.'
    - 'Accepted at IROS 2026 with an open arXiv manuscript.'
