# Curates the /projects page. A project is a piece of work, not a GitHub
# repository: it can link to any number of repositories, websites, datasets,
# or other public artifacts. Entries are rendered in this order.
#
# links: each link needs a human-readable label and an absolute URL.

projects:
  - slug: physical-human-robot-interaction
    name: Physical human–robot interaction controllers
    description: >-
      Research software for compliant physical interaction, collaborative
      assembly, smooth motion generation, and Kinova robot integration.
    featured: true
    links:
      - label: Explicit compliance controller
        url: https://github.com/mathieu-celerier/explicit_compliance_controller
      - label: Collaborative peg-in-hole controller
        url: https://github.com/mathieu-celerier/collaborative_peg_in_hole_controller
      - label: Minimum-jerk controller
        url: https://github.com/mathieu-celerier/minimum_jerk_controller
      - label: mc_kinova
        url: https://github.com/mathieu-celerier/mc_kinova
      - label: mc_kortex
        url: https://github.com/mathieu-celerier/mc_kortex
