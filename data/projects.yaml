# Curates the /projects page. GitHub-derived entries are looked up by repo
# name against https://github.com/mathieu-celerier (public, non-fork repos
# only) and rendered in the order listed here — nothing appears unless it's
# explicitly listed, so forks/dotfiles/scratch repos never show up by accident.
#
# include: repo names (as they appear in the GitHub URL) to feature, in order.
# overrides: optional per-repo description/featured override, keyed by repo name.
# manual: entirely non-GitHub entries (no repo lookup).

include:
  - explicit_compliance_controller
  - collaborative_peg_in_hole_controller
  - minimum_jerk_controller
  - mc_kinova
  - mc_kortex

overrides:
  explicit_compliance_controller:
    description: 'mc_rtc controller implementing explicit safety and compliance for physical interaction on torque-controlled robots.'
    featured: true
  humanoid_explicitly_compliance:
    description: 'Explicit compliance control extended to humanoid platforms for physical human-robot interaction.'
  PHRI_HL_controller:
    description: 'High-level controller for physical human-robot interaction experiments.'
  collaborative_peg_in_hole_controller:
    description: 'Controller for a collaborative peg-in-hole assembly task.'
  ral_exp_hierarchical_external_forces_controller:
    description: 'Experimental controller for hierarchical estimation and handling of external forces.'
  ROS_PHRI_HL_EXP:
    description: 'ROS-based experiment setup for physical human-robot interaction studies.'
  minimum_jerk_controller:
    description: 'Controller generating minimum-jerk trajectories for smooth robot motion.'
  mc_kinova:
    description: 'mc_rtc interface for Kinova robotic arms.'

manual: []
# Example:
# manual:
#   - name: 'Some tool'
#     description: 'A short description.'
#     url: 'https://example.com'
#     featured: false
